[package]
name = "todosodo-desktop"
version = "1.0.2"
description = "ToDoSoDo desktop client"
authors = ["ToDoSoDo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "todosodo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Позволяет собрать unused-предупреждения как ошибки в CI.
custom-protocol = ["tauri/custom-protocol"]
