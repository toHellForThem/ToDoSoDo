name: Frontend

on:
  push:
    branches: ["main", "epic/frontend-refactor"]
  pull_request:
    branches: ["main", "epic/frontend-refactor"]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck and contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run tsc

      - name: Check contract
        run: npm run contract:check
